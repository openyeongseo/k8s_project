apiVersion: apps/v1
kind: Deployment
metadata:
  name: point-service
  namespace: healthshop
  labels:
    app: point-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: point-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: point-service
    spec:
      containers:
        - name: point-service
          image: harbor.geunuk.local/healthshop/point-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "mariadb123"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: point-service
  namespace: healthshop
spec:
  selector:
    app: point-service
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: point-service-hpa
  namespace: healthshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: point-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
