apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: healthshop
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: order-service
          image: 192.168.0.13/k8s_project/order-service:v1.0-143
          ports:
            - containerPort: 8083
          env:
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "mariadb123"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: KAFKA_ENABLED
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dkafka.enabled=false"
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: healthshop
spec:
  selector:
    app: order-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
