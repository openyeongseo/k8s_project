server:
  port: 8086
spring:
  application:
    name: review-service
  datasource:
    url: jdbc:mariadb://mariadb:3306/geunuk_review?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:geunuk}
    password: ${DB_PASSWORD:geunuk1234}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false
    properties.hibernate.dialect: org.hibernate.dialect.MariaDBDialect
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /api-docs
management.endpoints.web.exposure.include: health,info
