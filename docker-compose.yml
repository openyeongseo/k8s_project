version: '3.8'

networks:
  geunuk-net:
    driver: bridge

volumes:
  mariadb-data:
  redis-data:
  mongo-data:
  kafka-data:

services:

  mariadb:
    image: mariadb:10.11
    container_name: geunuk-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_USER: geunuk
      MYSQL_PASSWORD: geunuk1234
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - geunuk-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: geunuk-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - geunuk-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mongodb:
    image: mongo:4.4
    container_name: geunuk-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - geunuk-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: geunuk-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - geunuk-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: geunuk-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - geunuk-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: geunuk-auth
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DB_USERNAME: geunuk
      DB_PASSWORD: geunuk1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: Z2V1bnVrLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5n
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/geunuk_auth?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SERVICE_POINT_URL: http://point-service:8085
    ports:
      - "8081:8081"
    networks:
      - geunuk-net

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: geunuk-product
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    environment:
      DB_USERNAME: geunuk
      DB_PASSWORD: geunuk1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongodb:27017/geunuk_logs
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/geunuk_product?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    ports:
      - "8082:8082"
    networks:
      - geunuk-net

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: geunuk-order
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      kafka:
        condition: service_started
      mongodb:
        condition: service_started
    environment:
      DB_USERNAME: geunuk
      DB_PASSWORD: geunuk1234
      MONGODB_URI: mongodb://mongodb:27017/geunuk_logs
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/geunuk_order?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    ports:
      - "8083:8083"
    networks:
      - geunuk-net

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: geunuk-cart
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8084:8084"
    networks:
      - geunuk-net

  point-service:
    build:
      context: ./point-service
      dockerfile: Dockerfile
    container_name: geunuk-point
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
    environment:
      DB_USERNAME: geunuk
      DB_PASSWORD: geunuk1234
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/geunuk_point?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    ports:
      - "8085:8085"
    networks:
      - geunuk-net

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: geunuk-review
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
    environment:
      DB_USERNAME: geunuk
      DB_PASSWORD: geunuk1234
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/geunuk_review?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    ports:
      - "8086:8086"
    networks:
      - geunuk-net

  nginx-gateway:
    image: nginx:alpine
    container_name: geunuk-gateway
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    networks:
      - geunuk-net

  frontend:
    build:
      context: ./geunuk-frontend
      dockerfile: Dockerfile
    container_name: geunuk-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - geunuk-net
