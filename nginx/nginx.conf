events {
    worker_connections 1024;
}

http {
    upstream auth-service    { server auth-service:8081; }
    upstream product-service { server product-service:8082; }
    upstream order-service   { server order-service:8083; }
    upstream cart-service    { server cart-service:8084; }
    upstream point-service   { server point-service:8085; }
    upstream review-service  { server review-service:8086; }

    server {
        listen 8080;

        # Auth
        location /api/auth/ {
            proxy_pass http://auth-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Product
        location /api/products {
            proxy_pass http://product-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Order
        location /api/orders {
            proxy_pass http://order-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Cart
        location /api/cart {
            proxy_pass http://cart-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Point
        location /api/points {
            proxy_pass http://point-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Review
        location /api/reviews {
            proxy_pass http://review-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
